<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Surveillance</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:16px system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}h1{margin:0 0 4px}.sub{color:#9ca3af}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:24px}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:16px}.video{width:100%;display:block;border-radius:8px;background:#030712}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#111827;border-radius:8px;padding:14px}.label{font-size:.8rem;color:#9ca3af;text-transform:uppercase}.value{font-size:1.7rem;font-weight:700}.normal{color:#4ade80}.monitor{color:#fbbf24}.suspicious,.offline{color:#f87171}li{margin:10px 0;color:#d1d5db}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>AI Smart Surveillance</h1><div class="sub">ESP32-CAM stream · YOLO detection · human-reviewed alerts</div><section class="grid"><div class="card"><img class="video" src="/video_feed" alt="Annotated camera stream"></div><aside class="card"><div class="stats"><div class="stat"><div class="label">Status</div><div id="status" class="value">CONNECTING</div></div><div class="stat"><div class="label">Score</div><div id="score" class="value">0</div></div><div class="stat"><div class="label">People</div><div id="people" class="value">0</div></div><div class="stat"><div class="label">Objects</div><div id="objects" class="value">0</div></div></div><h2>Recent events</h2><ul id="events"><li>Waiting for camera…</li></ul></aside></section></main><script>
async function update(){try{const r=await fetch('/api/status');const d=await r.json();const name=d.status.toLowerCase();const status=document.querySelector('#status');status.textContent=d.status;status.className='value '+name;document.querySelector('#score').textContent=d.score;document.querySelector('#people').textContent=d.people_count;document.querySelector('#objects').textContent=d.object_count;document.querySelector('#events').innerHTML=(d.events.length?d.events:[{message:'No active events',time:''}]).map(e=>`<li>${e.time} ${e.message}</li>`).join('')}catch(e){console.error(e)}}setInterval(update,1000);update();
</script></body></html>
